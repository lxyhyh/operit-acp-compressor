name: Build & Package

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: read

jobs:
  build:
    name: Typecheck · Test · Build · Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build & Package
        run: |
          npm run build
          npm run package

      - name: Show artifacts
        run: |
          ls -la dist/
          ls -la dist/*.toolpkg

      # upload-artifact v7（2025 年发布）：archive: false 单文件直传，artifact 名 =
      # 文件名（com.operit.acp_compressor-v0.3.0.toolpkg）。v8 download-artifact 按
      # content-type 判定解压，非 zip 存储的 artifact 不会被解压——下载得到的正是
      # .toolpkg 文件本体（同 README 中 tar 文件 archive:false 的例子）。
      - name: Upload toolpkg artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.toolpkg
          if-no-files-found: error
          retention-days: 14
          archive: false
