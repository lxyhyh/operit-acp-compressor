name: Build & Package

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: read

jobs:
  build:
    name: Typecheck · Test · Build · Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build & Package
        run: |
          npm run build
          npm run package

      - name: Show artifacts
        run: |
          ls -la dist/
          ls -la dist/*.toolpkg

      - name: Upload toolpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: acp-toolpkg
          path: dist/*.toolpkg
          if-no-files-found: error
          retention-days: 14
